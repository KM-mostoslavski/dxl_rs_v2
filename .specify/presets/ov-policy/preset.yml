schema_version: "1.0"

preset:
  id: ov-policy
  name: "ov policy"
  version: "0.1.0"
  description: "Prepends the ov POLICY.md to the constitution template, so every constitution starts with the ov policy"
  author: "TODO(author)"

requires:
  speckit_version: ">=1.2.0"

provides:
  templates:
    - type: template
      name: constitution-template
      file: templates/ov-policy.md
      strategy: prepend
      description: "Prepend POLICY.md to the constitution template"
