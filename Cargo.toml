[package]
name = "dxl_rs_v2"
version = "0.1.0"
edition = "2024"

[features]
default = ["std", "ax", "mx", "rx", "x-series", "y-series", "pro"]
std = ["alloc", "dep:serialport", "thiserror/std", "embedded-io/std"]
alloc = []
# Model families: each compiles in the actuator models of one product line.
ax = []
mx = []
rx = []
x-series = []
y-series = []
pro = []
# Scripted, allocation-free MockTransport for tests without hardware.
mock = []
# Opt-in: one result per slot for multi-actuator reads.
partial-reads = []
# Opt-in: read/write any register on one actuator, bypassing the bus's checks.
raw-registers = []

[dependencies]
serialport = { version = "4.9.0", optional = true }
thiserror = { version = "2.0.18", default-features = false }
embedded-io = { version = "0.7", default-features = false }
heapless = { version = "0.9", default-features = false }

[dev-dependencies]
proptest = "1"

[lints]
workspace = true

[workspace]
members = ["xtask"]

# The cycle's oracle lints (workflows/cycle/QA.md), from
# ov-agentic-workflow's Cargo.toml.snippet. CI builds with
# RUSTFLAGS=-D warnings, so every `warn` here fails CI.
[workspace.lints.rust]
missing_docs = "warn"

[workspace.lints.clippy]
# No mod.rs: a module is `foo.rs` with its children in `foo/`.
mod_module_files = "deny"
# A step-4 stub left behind fails the oracle at step 6.
# `unimplemented!` stays allowed: it is the SRS 5.0 marker.
todo = "warn"
dbg_macro = "warn"
